# StockSense — Phase 1 stack: infrastructure (Postgres + pgvector, Redis, RabbitMQ)
# plus intake, processor and api. Nginx and channel simulators come in Phase 3.
# Host ports bind to 127.0.0.1 so the dev stack is not exposed on the LAN.
# Passwords are embedded in connection URLs below: keep them URL-safe (no @ : / # ?).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PG_DB:-stocksense}
      POSTGRES_USER: ${PG_USER:-stocksense}
      POSTGRES_PASSWORD: ${PG_PASS:?set PG_PASS in .env}
      SEED_DATA: ${SEED_DATA:-true}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./db/initdb.sh:/docker-entrypoint-initdb.d/00_initdb.sh:ro
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?set REDIS_PASS in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASS}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq          # RabbitMQ stores data per node name; keep it fixed
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stocksense}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq   # durable queues survive container restarts
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"        # management UI for the demo
    healthcheck:
      # Not `rabbitmq-diagnostics ping`: healthchecks run as root with HOME=/var/lib/rabbitmq,
      # so on a fresh volume the CLI can create a root-owned .erlang.cookie before the broker
      # does, and the broker (user rabbitmq) then crashes with eacces. The AMQP port only opens
      # once the broker is up, so a TCP check is enough and touches no files.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Webhook intake: HMAC check, normalise, Redis duplicate check, publish with confirms.
  intake:
    build:
      context: .
      dockerfile: intake/Dockerfile
    environment:
      REDIS_URL: redis://:${REDIS_PASS}@redis:6379
      AMQP_URL: amqp://${RABBITMQ_USER:-stocksense}:${RABBITMQ_PASS}@rabbitmq:5672
      WEBHOOK_SECRET_AMAZON: ${WEBHOOK_SECRET_AMAZON:?set WEBHOOK_SECRET_AMAZON in .env}
      WEBHOOK_SECRET_FLIPKART: ${WEBHOOK_SECRET_FLIPKART:?set WEBHOOK_SECRET_FLIPKART in .env}
      WEBHOOK_SECRET_WEBSITE: ${WEBHOOK_SECRET_WEBSITE:?set WEBHOOK_SECRET_WEBSITE in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:${INTAKE_PORT:-8080}:3000"
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  # Event processor: applies each event exactly once, acks after commit.
  processor:
    build:
      context: .
      dockerfile: processor/Dockerfile
    environment:
      DATABASE_URL: postgresql://${PG_USER:-stocksense}:${PG_PASS}@postgres:5432/${PG_DB:-stocksense}
      AMQP_URL: amqp://${RABBITMQ_USER:-stocksense}:${RABBITMQ_PASS}@rabbitmq:5672
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  # Dashboard API (read-only in Phase 1). Docs at http://localhost:8000/docs
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${PG_USER:-stocksense}:${PG_PASS}@postgres:5432/${PG_DB:-stocksense}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  rabbitdata:

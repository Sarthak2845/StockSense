# StockSense — Phase 0 stack: Postgres (+pgvector), Redis, RabbitMQ.
# Services (intake, nginx, processor, api, simulators) are added in later phases.
# Host ports bind to 127.0.0.1 so the dev stack is not exposed on the LAN.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PG_DB:-stocksense}
      POSTGRES_USER: ${PG_USER:-stocksense}
      POSTGRES_PASSWORD: ${PG_PASS:?set PG_PASS in .env}
      SEED_DATA: ${SEED_DATA:-true}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./db/initdb.sh:/docker-entrypoint-initdb.d/00_initdb.sh:ro
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?set REDIS_PASS in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASS}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq          # RabbitMQ stores data per node name; keep it fixed
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stocksense}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq   # durable queues survive container restarts
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"        # management UI for the demo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  rabbitdata:

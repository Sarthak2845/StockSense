# Job names below MUST match the status-check names in the rulesets.

name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev]

jobs:
  # Only dev (or a hotfix/* branch) may be merged into prod
  prod-source-check:
    name: prod-source-check
    if: github.base_ref == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "dev" ] || [[ "$HEAD_REF" == hotfix/* ]]; then
            echo "OK: $HEAD_REF -> prod"
          else
            echo "PRs into prod must come from dev or hotfix/*, not $HEAD_REF"
            exit 1
          fi

  intake-tests:
    name: intake-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  processor-tests:
    name: processor-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
